name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Check plugin script syntax
        run: yq '.run.exec' env0.plugin.yaml | bash -n

      - name: Check the README uses the plugin default version
        run: |
          default_version="$(sed -n 's/^ *PLUGIN_DEFAULT_VERSION=//p' env0.plugin.yaml)"
          readme_versions="$(grep -oE 'env0-import-variable-plugin@[0-9][0-9A-Za-z.-]*' README.md | cut -d@ -f2 | sort -u | paste -sd ' ' -)"
          if [[ "$readme_versions" != "$default_version" ]]; then
            echo "::error file=README.md::README pins '${readme_versions}', but PLUGIN_DEFAULT_VERSION is '$default_version'"
            exit 1
          fi
