name: Release

on:
  pull_request:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-build:
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/import-variable-plugin_linux_$arch" main.go
          done
          cp importVariables.sh dist/importVariables.sh
          cd dist && sha256sum import-variable-plugin_linux_* importVariables.sh > checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test-arch:
    name: smoke-test-${{ matrix.arch }}
    needs: release-build
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: Verify the binary is static
        working-directory: dist
        run: |
          file "import-variable-plugin_linux_${{ matrix.arch }}" | tee file.txt
          grep -q "statically linked" file.txt
          grep -q "${{ matrix.elf_machine }}" file.txt

      - name: Run the binary on Alpine
        working-directory: dist
        run: |
          chmod +x "import-variable-plugin_linux_${{ matrix.arch }}"
          docker run --rm -v "$PWD:/dist:ro" -w /tmp alpine:3.22 "/dist/import-variable-plugin_linux_${{ matrix.arch }}" > output.txt 2>&1 || true
          cat output.txt
          grep -q "Hello, Import Variable Plugin!" output.txt

  smoke-test:
    name: smoke-test
    if: always()
    needs: smoke-test-arch
    runs-on: ubuntu-latest
    steps:
      - name: Check all architectures passed
        env:
          SMOKE_TEST_RESULT: ${{ needs.smoke-test-arch.result }}
        run: test "$SMOKE_TEST_RESULT" = success

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Upload release assets
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            create_flags=(--verify-tag --title "$TAG" --generate-notes)
            if [[ "$TAG" == *-* ]]; then
              create_flags+=(--prerelease)
            fi
            gh release create "$TAG" "${create_flags[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
