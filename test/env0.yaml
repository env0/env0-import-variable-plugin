version: 2

deploy:
  steps:
    setupVariables:
      after:
        - name: Import Variables
          use: https://github.com/env0/env0-import-variable-plugin@claude/modest-maxwell-462744
          inputs:
            version: 0.5.0-rc.1
    terraformOutput:
      after:
        - name: Test Outputs
          run: |
            export | grep -i "env"
            cat env1.auto.tfvars.json