version: 2

deploy:
  steps:
    setupVariables:
      after:
        - name: Import Variables
          run: |
            sed -n '/^  exec: |$/,$p' "$ENV0_ROOT_DIR/env0.plugin.yaml" | tail -n +2 | sed 's/^    //' | bash
    terraformOutput:
      after:
        - name: Test Outputs
          run: |
            export | grep -i "env"
            cat env1.auto.tfvars.json